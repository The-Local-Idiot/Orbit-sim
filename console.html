<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Telemetry Console</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060913;
            color: #00f2ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #console-container {
            display: flex;
            background: rgba(10, 15, 30, 0.85);
            border: 2px solid #00f2ff;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            gap: 25px;
            backdrop-filter: blur(10px);
        }

        .screen-section {
            position: relative;
            background: #02040a;
            border: 1px solid #1a365d;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }

        /* Sidebar Control Center */
        .control-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-block {
            border-bottom: 2px dashed #1a365d;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .status-tag {
            font-size: 11px;
            color: #00ff66;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: inline-block;
        }

        /* Real-time Data Grid */
        .data-stream {
            background: rgba(2, 4, 10, 0.8);
            border: 1px solid #1a365d;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-family: monospace;
        }

        .data-label {
            color: #718096;
        }

        .data-val {
            color: #ffffff;
            font-weight: bold;
        }

        /* Input Controls */
        .sliders-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .slider-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
        }

        .current-num {
            color: #ff007f;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.4);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #1a365d;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00f2ff;
            box-shadow: 0 0 8px #00f2ff;
            cursor: pointer;
            transition: 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            background: #ff007f;
            box-shadow: 0 0 12px #ff007f;
        }
    </style>
</head>
<body>

    <div id="console-container">
        <!-- Main Radar Screen -->
        <div class="screen-section">
            <canvas id="radarScreen" width="520" height="520"></canvas>
        </div>

        <!-- Right Side HUD -->
        <div class="control-panel">
            <div>
                <div class="header-block">
                    <h1>SYS.ORBITAL.V1</h1>
                    <span class="status-tag">// TELEMETRY LIVE</span>
                </div>

                <!-- Live Data Readouts -->
                <div class="data-stream">
                    <div class="data-row">
                        <span class="data-label">MASS BALANCE Ratio</span>
                        <span class="data-val" id="hudRatio">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">PLANET SCALE Radius</span>
                        <span class="data-val" id="hudRadius" style="color:#ff007f;">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">STELLAR WOBBLE Width</span>
                        <span class="data-val" id="hudWobble" style="color:#ffaa00;">--</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">VECTOR VELOCITY</span>
                        <span class="data-val" id="hudVelocity" style="color:#00ff66;">--</span>
                    </div>
                </div>
            </div>

            <!-- Custom Controls Matrix -->
            <div class="sliders-stack">
                <div class="slider-box">
                    <div class="slider-label-row">
                        <span>Warp Core Speed</span>
                        <span class="current-num" id="lblSpeed">1.0x</span>
                    </div>
                    <input type="range" id="inputSpeed" min="0" max="4" step="0.1" value="1">
                </div>

                <div class="slider-box">
                    <div class="slider-label-row">
                        <span>Separation Span</span>
                        <span class="current-num" id="lblDist">170 px</span>
                    </div>
                    <input type="range" id="inputDist" min="80" max="230" step="5" value="170">
                </div>

                <div class="slider-box">
                    <div class="slider-label-row">
                        <span>Planet Mass</span>
                        <span class="current-num" id="lblMass">1.0x</span>
                    </div>
                    <input type="range" id="inputMass" min="0.1" max="3.0" step="0.1" value="1">
                </div>

                <div class="slider-box">
                    <div class="slider-label-row">
                        <span>Orbit Oval (Ecc)</span>
                        <span class="current-num" id="lblEcc">0.00</span>
                    </div>
                    <input type="range" id="inputEcc" min="0" max="0.7" step="0.05" value="0">
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarScreen');
        const ctx = canvas.getContext('2d');

        // Capture Sliders
        const speedSl = document.getElementById('inputSpeed');
        const distSl = document.getElementById('inputDist');
        const massSl = document.getElementById('inputMass');
        const eccSl = document.getElementById('inputEcc');

        // Capture HUD Text fields
        const lblSpeed = document.getElementById('lblSpeed');
        const lblDist = document.getElementById('lblDist');
        const lblMass = document.getElementById('lblMass');
        const lblEcc = document.getElementById('lblEcc');

        const hudRatio = document.getElementById('hudRatio');
        const hudRadius = document.getElementById('hudRadius');
        const hudWobble = document.getElementById('hudWobble');
        const hudVelocity = document.getElementById('hudVelocity');

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let currentAngle = 0;
        const historyBuffer = [];

        function renderEngineLoop() {
            // Dark radar screen clear background
            ctx.fillStyle = '#02040a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Get live values from input panels
            const speedValue = parseFloat(speedSl.value);
            const totalDistancePx = parseFloat(distSl.value);
            const massMultiplier = parseFloat(massSl.value);
            const orbitalEcc = parseFloat(eccSl.value);

            // Update user interface display tags
            lblSpeed.innerText = speedValue.toFixed(1) + 'x';
            lblDist.innerText = totalDistancePx + ' px';
            lblMass.innerText = massMultiplier.toFixed(1) + 'x';
            lblEcc.innerText = orbitalEcc.toFixed(2);

            // Gravity Calculation Nodes
            const massStar = 100;
            const massPlanet = 8 * massMultiplier; 
            const massTotal = massStar + massPlanet;

            // Compute UI Header stats
            hudRatio.innerText = (massStar / massPlanet).toFixed(1) + " : 1.0";
            const visualPlanetSize = 4 + (massMultiplier * 3.5);
            hudRadius.innerText = visualPlanetSize.toFixed(1) + " px";

            // Semi-major scaling breakdown mapping
            const a_planet = totalDistancePx * (massStar / massTotal);
            const a_star = totalDistancePx * (massPlanet / massTotal);
            hudWobble.innerText = a_star.toFixed(1) + " px";

            // Determine instantaneous distances from the focal barycenter centerpoint
